<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h2>Hello User</h2>
        <div class="container mt-5">
            <form id="loginForm">
                <div class="form-group">
                    <label for="UserName">User Name</label>
                    <input type="text" class="form-control" id="UserName" placeholder="Enter Username">
                </div>
                <div class="form-group">
                    <label for="UserMsg">Msg</label>
                    <input type="text" class="form-control" id="UserMsg" placeholder="Enter Message">
                </div>
                <button type="button" class="btn btn-primary" onclick="Send()">Send Message</button>
                <button type="button" class="btn btn-secondary" onclick="GetMsg()">Get Message</button>
            </form>
        </div>
        <div id="messages" class="mt-3"></div>
    </div>

    <script>
        function Send() {
            var UserName = $("#UserName").val().trim();
            var UserMsg = $("#UserMsg").val().trim();
            
            if (!UserName || !UserMsg) {
                alert("Please fill in both fields.");
                return;
            }

            $.get(`/Push/action/${encodeURIComponent(UserName)}/${encodeURIComponent(UserMsg)}`)
                .done(() => {
                    alert("Message sent successfully!");
                })
                .fail(() => {
                    alert("Failed to send message. Please try again.");
                });
        }

        function GetMsg() {
            $.get("/Push/action")
                .done((data) => {
                    if (data !== "N/A") { 
                        $("#messages").append(`<p><strong>Received:</strong> ${data}</p>`);
                    }
                })
                .fail(() => {
                    alert("Failed to get message.");
                });
        }
    </script> 
</body>
</html>
