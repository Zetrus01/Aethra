<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHRA - Kosár</title>

  <!-- BOOTSTRAP -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/6.7.0/css/flag-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="style">
    <link rel="stylesheet" href="css/style.css">
   <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF8C00' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='8' cy='21' r='1'/><circle cx='19' cy='21' r='1'/><path d='M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12'/></svg>">
  
  <style>
    /* KOSÁR OLDAL STÍLUSOK - TÉMA ÉRZÉKENY */
    :root {
      --black: #000000;
      --white: #ffffff;
      --gray-50: #fafafa;
      --gray-100: #f5f5f5;
      --gray-200: #e5e5e5;
      --gray-300: #d4d4d4;
      --gray-400: #a3a3a3;
      --gray-500: #737373;
      --gray-600: #525252;
      --gray-700: #404040;
      --gray-800: #262626;
      --gray-900: #171717;
      --accent: #ff6b35;
      
      /* Kosár specifikus változók */
      --cart-bg: var(--black);
      --cart-card-bg: var(--gray-900);
      --cart-text: var(--white);
      --cart-border: var(--gray-800);
      --cart-hover: var(--gray-800);
      --cart-input-bg: var(--gray-700);
      --cart-input-border: var(--gray-600);
      --cart-section-bg: var(--gray-800);
      --cart-shadow: rgba(0, 0, 0, 0.3);
    }

    /* VILÁGOS TÉMA - KOSÁR OLDAL */
    [data-theme="light"] {
      --cart-bg: #ffffff;
      --cart-card-bg: #f8fafc;
      --cart-text: #1a1a1a;
      --cart-border: #e2e8f0;
      --cart-hover: #f1f5f9;
      --cart-input-bg: #ffffff;
      --cart-input-border: #cbd5e1;
      --cart-section-bg: #f1f5f9;
      --cart-shadow: rgba(0, 0, 0, 0.1);
      --navbar-bg: transparent;
      --navbar-scrolled-bg: rgba(255, 255, 255, 0.95);
      --navbar-text: #1e293b;
      --dropdown-bg: rgba(255, 255, 255, 0.98);
      --dropdown-border: rgba(37, 99, 235, 0.1);
      
      /* Light mode specifikus színek */
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --gray-900: #0f172a;
      
      /* Accent szín light mode-hoz */
      --accent: #4c9eed;
    }

    .navbar-custom {
      --navbar-text: #ffffff !important;
    }

    [data-theme="light"] .navbar-custom {
      --navbar-text: #1e293b !important;
    }

    [data-theme="dark"] .navbar-custom {
      --navbar-text: #ffffff !important;
    }

    [data-theme="light"] .navbar-custom.scrolled {
      --navbar-scrolled-bg: rgba(255, 255, 255, 0.95) !important;
    }

    [data-theme="light"] .navbar-custom.scrolled .navbar-nav .nav-link {
      color: #1e293b !important;
    }

    [data-theme="light"] .navbar-custom.scrolled .navbar-brand {
      color: #1e293b !important;
    }

    [data-theme="light"] .navbar-custom.scrolled .profile-btn {
      border-color: #1e293b !important;
      color: #1e293b !important;
    }

    [data-theme="light"] .navbar-custom.scrolled .profile-btn:hover {
      background-color: rgba(37, 99, 235, 0.1) !important;
      color: #1e293b !important;
      border-color: var(--accent) !important;
    }

    .navbar-custom .navbar-nav .nav-link {
      color: var(--navbar-text) !important;
      font-weight: 500 !important;
      transition: color 0.3s ease !important;
    }

    .navbar-custom .navbar-nav .nav-link:hover {
      color: var(--accent) !important;
    }

    .navbar-custom .navbar-nav .nav-link.active {
      color: var(--accent) !important;
      font-weight: 600 !important;
    }

    .navbar-custom .navbar-nav .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: 1px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      max-width: 60%;
      height: 2px;
      background-color: var(--accent);
      border-radius: 2px;
    }

    .navbar-custom .navbar-brand {
      color: var(--navbar-text) !important;
      font-weight: 700 !important;
    }

    /* PROFIL GOMB SZÍNEI */
    .navbar-custom .profile-btn {
      border-color: var(--navbar-text) !important;
      color: var(--navbar-text) !important;
    }

    .navbar-custom .profile-btn:hover {
      background-color: rgba(255, 255, 255, 0.1) !important;
      color: var(--navbar-text) !important;
      border-color: var(--accent) !important;
    }

    /* SCROLLED NAVBAR SZÍNEI */
    .navbar-custom.scrolled {
      background: var(--navbar-scrolled-bg) !important;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .navbar-custom.scrolled .navbar-nav .nav-link {
      color: var(--navbar-text) !important;
    }

    .navbar-custom.scrolled .navbar-nav .nav-link:hover {
      color: var(--accent) !important;
    }

    .navbar-custom.scrolled .navbar-nav .nav-link.active {
      color: var(--accent) !important;
    }

    .navbar-custom.scrolled .navbar-brand {
      color: var(--navbar-text) !important;
    }

    .navbar-custom.scrolled .profile-btn {
      border-color: var(--navbar-text) !important;
      color: var(--navbar-text) !important;
    }

    .navbar-custom.scrolled .profile-btn:hover {
      background-color: rgba(255, 255, 255, 0.1) !important;
      color: var(--navbar-text) !important;
      border-color: var(--accent) !important;
    }

    body {
      background: var(--cart-bg);
      font-family: 'Merriweather', serif;
      margin: 0;
      padding: 0;
      color: var(--cart-text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .page-container {
      padding-top: 60px;
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0.5rem;
      padding-top: 70px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease;
      background: var(--cart-bg);
    }

    .page-container.animated {
      opacity: 1;
      transform: translateY(0);
    }

    .cart-container {
      width: 100%;
      max-width: 1000px;
      height: auto;
      margin-top: 1.5%;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease 0.3s;
    }

    .cart-container.animated {
      opacity: 1;
      transform: translateY(0);
    }

    .cart-card {
      background: var(--cart-card-bg);
      border-radius: 15px;
      padding: 1.5rem;
      border: 1px solid var(--cart-border);
      box-shadow: 0 8px 32px var(--cart-shadow);
      margin-top: 0;
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.6s ease 0.5s;
    }

    .cart-card.animated {
      opacity: 1;
      transform: scale(1);
    }

    .cart-header {
      text-align: center;
      margin-bottom: 1.5rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease 0.7s;
    }

    .cart-header.animated {
      opacity: 1;
      transform: translateY(0);
    }

    .cart-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, var(--accent), #e55a2b);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.8rem;
      font-size: 1.8rem;
      color: var(--white);
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
      opacity: 0;
      transform: scale(0.8) rotate(-10deg);
      transition: all 0.4s ease 0.8s;
    }

    [data-theme="light"] .cart-icon {
      background: linear-gradient(135deg, #89E6F6, #8EC5FF);
      color: #000000;
      box-shadow: 0 4px 12px rgba(137, 230, 246, 0.4);
    }

    .cart-icon.animated {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .cart-title {
      font-family: 'Merriweather', serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      color: var(--cart-text);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s ease 0.9s;
    }

    .cart-title.animated {
      opacity: 1;
      transform: translateY(0);
    }

    .cart-subtitle {
      color: var(--gray-400);
      font-size: 0.95rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s ease 1s;
    }

    .cart-subtitle.animated {
      opacity: 1;
      transform: translateY(0);
    }

    /* Kosár tartalom */
    .cart-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 768px) {
      .cart-content {
        grid-template-columns: 1fr;
      }
    }

    /* Kosár elemek */
    .cart-items-section {
      background: var(--cart-section-bg);
      border-radius: 10px;
      padding: 1.5rem;
      border: 1px solid var(--cart-border);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease;
    }

    .cart-items-section.animated {
      opacity: 1;
      transform: translateY(0);
    }

    .section-title {
      font-family: 'Merriweather', serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--cart-text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title i {
      color: var(--accent);
      font-size: 1.1rem;
    }

    .cart-items {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 400px;
      overflow-y: auto;
    }

    .cart-item {
      background: var(--cart-input-bg);
      border: 1px solid var(--cart-border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.8rem;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(10px);
    }

    .cart-item.animated {
      opacity: 1;
      transform: translateY(0);
    }

    .cart-item:hover {
      background: var(--cart-hover);
      border-color: var(--gray-500);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px var(--cart-shadow);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.8rem;
    }

    .item-name {
      font-weight: 600;
      color: var(--cart-text);
      font-size: 1rem;
      flex: 1;
    }

    .item-price {
      color: var(--accent);
      font-weight: 700;
      font-size: 1rem;
    }

    .item-description {
      color: var(--gray-400);
      font-size: 0.85rem;
      margin-bottom: 0.8rem;
    }

    .item-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .quantity-btn {
      background: var(--cart-section-bg);
      border: 1px solid var(--cart-border);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cart-text);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .quantity-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #000000;
    }

    .quantity-input {
      background: var(--cart-input-bg);
      border: 1px solid var(--cart-border);
      border-radius: 6px;
      width: 50px;
      height: 32px;
      text-align: center;
      color: var(--cart-text);
      font-weight: 600;
    }

    .remove-btn {
      background: rgba(220, 53, 69, 0.1);
      border: 1px solid rgba(220, 53, 69, 0.3);
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      color: #dc3545;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .remove-btn:hover {
      background: rgba(220, 53, 69, 0.2);
      border-color: #dc3545;
    }

    /* Asztalfoglalás rész - CSAK MEGJELENÍTÉS */
    .reservation-display-section {
      background: var(--cart-section-bg);
      border-radius: 10px;
      padding: 1.5rem;
      border: 1px solid var(--cart-border);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease;
    }

    .reservation-display-section.animated {
      opacity: 1;
      transform: translateY(0);
    }

    .reservation-info {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .reservation-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem;
      background: var(--cart-input-bg);
      border-radius: 8px;
      border-left: 4px solid var(--accent);
    }

    .reservation-label {
      color: var(--gray-300);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .reservation-value {
      color: var(--cart-text);
      font-weight: 700;
      font-size: 1rem;
    }

    .reservation-actions {
      margin-top: 1rem;
      display: flex;
      gap: 0.8rem;
    }

    .btn-modify {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1rem;
      color: #000000;
      font-weight: 600;
      transition: all 0.3s ease;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    [data-theme="light"] .btn-modify {
      background: #4c9eed;
    }

    .btn-modify:hover {
      background: #e55a2b;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(255, 107, 53, 0.3);
    }

    [data-theme="light"] .btn-modify:hover {
      background: #0CAEED;
      transform: translateY(-2px);
            box-shadow: 0 0 15px  rgba(33, 158, 181, 0.3);
    }

    .btn-cancel {
      background: rgba(220, 53, 69, 0.1);
      border: 1px solid rgba(220, 53, 69, 0.3);
      border-radius: 6px;
      padding: 0.6rem 1rem;
      color: #dc3545;
      font-weight: 600;
      transition: all 0.3s ease;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-cancel:hover {
      background: rgba(220, 53, 69, 0.2);
      border-color: #dc3545;
    }

    /* Összegzés rész */
    .summary-section {
      background: var(--cart-section-bg);
      border-radius: 10px;
      padding: 1.5rem;
      border: 1px solid var(--cart-border);
      margin-top: 1.5rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease;
    }

    .summary-section.animated {
      opacity: 1;
      transform: translateY(0);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--cart-border);
    }

    .summary-row:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .summary-label {
      color: var(--gray-400);
      font-weight: 600;
    }

    .summary-value {
      color: var(--cart-text);
      font-weight: 600;
    }

    .summary-total {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* Elfogadó gomb */
    .checkout-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 1rem;
      color: #000000;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
      font-size: 1rem;
      width: 100%;
      margin-top: 1.5rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease 1.6s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    [data-theme="light"] .checkout-btn {
      background: #89E6F6;
      color: #000000;
      box-shadow: 0 4px 12px rgba(137, 230, 246, 0.3);
    }

    .checkout-btn.animated {
      opacity: 1;
      transform: translateY(0);
    }

    .checkout-btn:hover {
      background: #e55a2b;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 107, 53, 0.4);
      color: #000000;
    }

    [data-theme="light"] .checkout-btn:hover {
      background: #8EC5FF;
      color: #000000;
      box-shadow: 0 6px 15px rgba(137, 230, 246, 0.4);
    }

    .checkout-btn:disabled {
      background: var(--gray-600);
      color: var(--gray-400);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ÜRES KOSÁR ÉS NINCS FOGLALÁS STÍLUSOK - KÖZÉPRE IGAZÍTVA */
    .empty-cart,
    .no-reservation {
        text-align: center;
        padding: 3rem 2rem;
        color: var(--gray-400);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 300px;
        width: 100%;
    }

    .empty-cart-icon,
    .no-reservation-icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
        color: var(--gray-500);
        opacity: 0.7;
    }

    .empty-cart h4,
    .no-reservation h4 {
        margin-bottom: 0.8rem;
        color: var(--cart-text);
        font-family: 'Merriweather', serif;
        font-weight: 600;
        font-size: 1.4rem;
    }

    .empty-cart p,
    .no-reservation p {
        margin-bottom: 2rem;
        color: var(--gray-400);
        font-size: 1rem;
        max-width: 300px;
        line-height: 1.5;
    }

    .empty-cart .btn-modify,
    .no-reservation .btn-modify {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-width: 220px;
        margin: 0 auto;
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
        border-radius: 8px;
        transition: all 0.3s ease;
    }

    /* Animációk az üres állapotokhoz */
    .empty-cart,
    .no-reservation {
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.6s ease;
    }

    .empty-cart.animated,
    .no-reservation.animated {
        opacity: 1;
        transform: translateY(0);
    }

    .empty-cart-icon,
    .no-reservation-icon {
        transform: scale(0.8);
        transition: all 0.4s ease 0.2s;
    }

    .empty-cart.animated .empty-cart-icon,
    .no-reservation.animated .no-reservation-icon {
        transform: scale(1);
    }

    .empty-cart h4,
    .no-reservation h4,
    .empty-cart p,
    .no-reservation p {
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.4s ease 0.3s;
    }

    .empty-cart.animated h4,
    .no-reservation.animated h4,
    .empty-cart.animated p,
    .no-reservation.animated p {
        opacity: 1;
        transform: translateY(0);
    }

    .empty-cart .btn-modify,
    .no-reservation .btn-modify {
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.4s ease 0.4s;
    }

    .empty-cart.animated .btn-modify,
    .no-reservation.animated .btn-modify {
        opacity: 1;
        transform: translateY(0);
    }

    /* Loading state */
    .navbar-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: var(--gray-400);
      background: transparent;
      min-height: 70px;
    }

    .loading-spinner {
      border: 3px solid var(--gray-700);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 14px;
      height: 14px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Scrollbar styling */
    .cart-items::-webkit-scrollbar {
      width: 4px;
    }

    .cart-items::-webkit-scrollbar-track {
      background: var(--gray-700);
      border-radius: 2px;
    }

    .cart-items::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 2px;
    }

    /* MODAL STÍLUSOK KOSÁRHOZ */
    .order-success-modal .modal-content,
    .notes-modal .modal-content,
    .address-modal .modal-content,
    .payment-modal .modal-content {
      background: var(--cart-card-bg) !important;

      // Dátum/idő segédfüggvény
      function formatDateTimeForDisplay(reservationData) {
          if (!reservationData) {
              return { date: 'Nincs megadva', time: 'Nincs megadva' };
          }
          
          // Először próbáljuk az originalTime-t
          if (reservationData.originalTime && reservationData.originalTime !== 'Nincs megadva') {
              return {
                  date: reservationData.originalDate || reservationData.date || 'Nincs megadva',
                  time: reservationData.originalTime
              };
          }
          
          // Aztán a time mezőt
          if (reservationData.time && reservationData.time !== 'Nincs megadva') {
              return {
                  date: reservationData.date || 'Nincs megadva',
                  time: reservationData.time
              };
          }
          
          // Végül a datetime-t
          if (reservationData.datetime) {
              try {
                  const dateObj = new Date(reservationData.datetime);
                  const localTime = new Date(dateObj.getTime());
                  
                  const date = localTime.toLocaleDateString('hu-HU', {
                      year: 'numeric',
                      month: '2-digit',
                      day: '2-digit'
                  });
                  
                  const time = localTime.toLocaleTimeString('hu-HU', {
                      hour: '2-digit',
                      minute: '2-digit',
                      hour12: false
                  });
                  
                  return { date, time };
              } catch (error) {
                  console.error('❌ Hiba a dátum formázásakor:', error);
              }
          }
          
          return { date: 'Nincs megadva', time: 'Nincs megadva' };
      }
      
      
      // Extra szolgáltatások formázása
      function formatExtraServices(extraServices) {
          if (!extraServices) return 'Nincsenek extra szolgáltatások';
          
          try {
              // Ha JSON string, parse-oljuk
              if (typeof extraServices === 'string' && extraServices.trim().startsWith('[')) {
                  const services = JSON.parse(extraServices);
                  if (Array.isArray(services)) {
                      return services.map(service => {
                          if (typeof service === 'string') return service;
                          if (service.name) return service.name;
                          return service;
                      }).join(', ');
                  }
              }
              
              // Ha már tömb
              if (Array.isArray(extraServices)) {
                  return extraServices.map(service => {
                      if (typeof service === 'string') return service;
                      if (service.name) return service.name;
                      return service;
                  }).join(', ');
              }
              
              // Egyéb esetek
              return String(extraServices);
              
          } catch (error) {
              console.error('❌ Extra szolgáltatások formázási hiba:', error);
              return String(extraServices);

                  console.log('✅ CartManager inicializálva');

                  if (window.cartManager) {
                      callback();
                  } else {

function updateSummary(cartData) {
    console.log('💰 Összegzés frissítése:', cartData);

    const foodItems = cartData.items ? cartData.items.filter(item => 
        item.type !== 'reservation' && !item.reservationData

        return total + (item.price * (item.quantity || 1));
    }, 0);
    
    // Szolgáltatási díj: 10%
    const serviceFee = Math.round(foodTotal * 0.1);
    
    // **EXTRA SZOLGÁLTATÁSOK ÖSSZEGZÉSE**
    let extraServicesTotal = 0;
    let extraServicesList = [];
    
    if (cartData.reservationDetails && cartData.reservationDetails.extraServices) {
        const extraResult = calculateExtraServicesNoDiscount(cartData.reservationDetails);
        extraServicesTotal = extraResult.total;
        extraServicesList = extraResult.services;
        
        console.log('✨ Extra szolgáltatások a kosárban:', {
            total: extraServicesTotal,
            services: extraServicesList
        });
    }
    
    // Végösszeg (ételek + szolgáltatási díj + extra szolgáltatások)
    const totalAmount = foodTotal + serviceFee + extraServicesTotal;
    
    // **MENTJÜK GLOBÁLISAN IS**
    orderFoodTotal = foodTotal;
    orderServiceFee = serviceFee;
    extraServicesTotal = extraServicesTotal;
    extraServicesList = extraServicesList;
    orderTotalAmount = totalAmount;
    
    // **HTML FRISSÍTÉSE**

    $('#service-fee').text(serviceFee.toLocaleString() + ' Ft');

            $('#extra-services-total').text(extraServicesTotal.toLocaleString() + ' Ft');

        // Ha nincsenek extra szolgáltatások, távolítsuk el a sort
        $('#extra-services-row').remove();
    }
    
    // **VÉGÖSSZEG MEGJELENÍTÉSE**

        serviceFee,
        extraServicesTotal,
        totalAmount,
        extraServicesCount: extraServicesList.length

function calculateExtraServicesNoDiscount(reservationDetails) {
    console.log('🔍 calculateExtraServicesNoDiscount hívva:', reservationDetails);
    
    if (!reservationDetails || !reservationDetails.extraServices) {
        console.log('❌ Nincs extraServices a reservationDetails-ben');
        return {
            total: 0,
            services: [],
            serviceCount: 0
        };
    }
    
    console.log('📦 Extra szolgáltatások feldolgozása:', reservationDetails.extraServices);
    console.log('🔍 Type of extraServices:', typeof reservationDetails.extraServices);
    
    let extraServicesTotal = 0;
    let extraServicesList = [];
    let processedServices = new Set(); // A duplikációk elkerülésére
    
    try {
        let servicesArray = [];
        
        // **FONTOS: Ha már eleve tömb formátumban van az extraServices**
        if (Array.isArray(reservationDetails.extraServices)) {
            console.log('✅ Már tömb formátumban van az extraServices');
            servicesArray = reservationDetails.extraServices;
        }
        // **Ha string, akkor próbáljuk JSON-ként parse-olni**
        else if (typeof reservationDetails.extraServices === 'string') {
            const servicesText = reservationDetails.extraServices;
            console.log('📝 Szöveg formátum:', servicesText);
            
            // Ha üres vagy "Nincsenek extra szolgáltatások"
            if (!servicesText || servicesText.trim() === '' || 
                servicesText.toLowerCase().includes('nincsenek')) {
                console.log('ℹ️ Nincsenek extra szolgáltatások');
                return { total: 0, services: [], serviceCount: 0 };
            }
            
            // **Próbáljuk JSON-ként értelmezni**
            try {
                const parsed = JSON.parse(servicesText);
                if (Array.isArray(parsed)) {
                    servicesArray = parsed;
                    console.log('✅ JSON parse sikeres, tömb:', servicesArray);
                } else {
                    console.warn('⚠️ JSON parse sikeres, de nem tömb:', parsed);
                    servicesArray = [parsed];
                }
            } catch (e) {
                console.warn('⚠️ Nem JSON string, vesszővel elválasztott listaként kezeljük');
                // Ha vesszővel van elválasztva
                if (servicesText.includes(',')) {
                    servicesArray = servicesText.split(',').map(s => s.trim()).filter(s => s);
                    console.log('📊 Vesszővel elválasztott lista:', servicesArray);
                } else {
                    // Egyébként egyetlen szolgáltatás
                    servicesArray = [servicesText.trim()];
                }
            }
        }
        // **Ha object, de nem tömb**
        else if (typeof reservationDetails.extraServices === 'object') {
            console.log('🔄 Object formátum, átalakítás tömbbé');
            // Ha kulcs-érték párok (pl. {balloons: {name: "Bélelt légballonok", price: 5000}})
            servicesArray = Object.values(reservationDetails.extraServices);
        }
        
        console.log(`📊 Feldolgozandó szolgáltatások (${servicesArray.length} db):`, servicesArray);
        
        // **SZOLGÁLTATÁSOK FELDOLGOZÁSA - DUPLIKÁCIÓK KISZŰRÉSE**
        servicesArray.forEach((service, index) => {
            console.log(`🔄 ${index + 1}. szolgáltatás feldolgozása:`, service);
            
            let serviceName = '';
            let servicePrice = 0;
            let serviceId = '';
            
            // **Ha a service egy object (name, price tulajdonságokkal)**
            if (service && typeof service === 'object') {
                serviceName = service.name || '';
                servicePrice = service.price || 0;
                serviceId = service.id || serviceName.toLowerCase().replace(/\s+/g, '-');
                
                console.log(`   Object formátum - név: "${serviceName}", ár: ${servicePrice} Ft`);
            }
            // **Ha a service egy string**
            else if (typeof service === 'string') {
                serviceName = service;
                servicePrice = EXTRA_SERVICES_PRICES[service] || estimateServicePrice(service);
                serviceId = service.toLowerCase().replace(/\s+/g, '-');
                
                console.log(`   String formátum - név: "${serviceName}", ár: ${servicePrice} Ft (becsült)`);
            }
            
            // **Ha van név és ár, és még nem dolgoztuk fel**
            if (serviceName && servicePrice > 0) {
                // Egyedi azonosító a duplikációk kiszűrésére
                const uniqueKey = `${serviceName}_${servicePrice}`;
                
                if (!processedServices.has(uniqueKey)) {
                    processedServices.add(uniqueKey);
                    
                    const serviceInfo = {
                        id: serviceId,
                        name: serviceName,
                        price: servicePrice,
                        type: 'extra'
                    };
                    
                    extraServicesList.push(serviceInfo);
                    extraServicesTotal += servicePrice;
                    
                    console.log(`   ✅ Szolgáltatás hozzáadva: ${serviceName} (${servicePrice} Ft)`);
                } else {
                    console.log(`   ⚠️ Duplikált szolgáltatás kihagyva: ${serviceName}`);
                }
            } else {
                console.warn(`   ❌ Érvénytelen szolgáltatás, kihagyva:`, service);
            }
        });
        
        console.log('💰 Extra szolgáltatások végösszeg:', extraServicesTotal.toLocaleString() + ' Ft');
        console.log('📋 Extra szolgáltatások listája (egyedi):', extraServicesList);
        
        return {
            total: extraServicesTotal,
            services: extraServicesList,
            serviceCount: extraServicesList.length
        };
        
    } catch (error) {
        console.error('❌ Hiba az extra szolgáltatások feldolgozásakor:', error);
        console.error('❌ Error stack:', error.stack);
        return {
            total: 0,
            services: [],
            serviceCount: 0
        };
    }
}

// SEGÉDFÜGGVÉNY: Ár becslése, ha nincs előre definiálva
function estimateServicePrice(serviceName) {
    // Alapár
    const defaultPrice = 5000;
    
    // Kulcsszavak alapján becslés
    const keywords = {
        'ballon': 5000,
        'virág': 8000,
        'pezsgő': 12000,
        'champagne': 12000,
        'desszert': 6000,
        'szék': 2500,
        'kiszolgálás': 15000,
        'parkoló': 3000,
        'fotózás': 25000,
        'zen': 15000,
        'dj': 12000,
        'dekor': 10000
    };
    
    const lowerName = serviceName.toLowerCase();
    
    for (const [keyword, price] of Object.entries(keywords)) {
        if (lowerName.includes(keyword)) {
            return price;
        }
    }
    
    return defaultPrice;
}
function parseExtraServicesData(extraServicesData) {
    console.log('🔍 parseExtraServicesData hívva:', extraServicesData);
    console.log('🔍 Input type:', typeof extraServicesData);
    
    try {
        // 0. Ha undefined vagy null
        if (!extraServicesData) {
            console.log('❌ extraServicesData undefined vagy null');
            return [];
        }
        
        // 1. Ha már tömb
        if (Array.isArray(extraServicesData)) {
            console.log('✅ Már tömb formátum');
            return extraServicesData;
        }
        
        // 2. Ha string (és nem tömb stringként)
        if (typeof extraServicesData === 'string') {
            console.log('📝 String formátum:', extraServicesData.substring(0, 100) + '...');
            
            // Próbáljuk meg JSON-ként
            try {
                const parsed = JSON.parse(extraServicesData);
                console.log('✅ JSON parse sikeres:', parsed);
                // Rekurzívan hívjuk meg magát a parse-olt adattal
                return parseExtraServicesData(parsed);
            } catch (e) {
                console.warn('⚠️ Nem JSON string');
                
                // Ha vesszővel elválasztott lista
                if (extraServicesData.includes(',')) {
                    console.log('🔄 Vesszővel elválasztott lista feldolgozása...');
                    return extraServicesData.split(',').map(item => {
                        const trimmed = item.trim();
                        return {
                            id: trimmed.toLowerCase().replace(/\s+/g, '-'),
                            name: trimmed,
                            price: 0 // Ismeretlen ár
                        };
                    });
                }
                
                // Egyébként egy szolgáltatás
                return [{
                    id: extraServicesData.toLowerCase().replace(/\s+/g, '-'),
                    name: extraServicesData,
                    price: 0
                }];
            }
        }
        
        // 3. Ha object (de nem tömb)
        if (typeof extraServicesData === 'object' && extraServicesData !== null) {
            console.log('🔄 Object formátum feldolgozása...');
            console.log('🔑 Object kulcsok:', Object.keys(extraServicesData));
            
            // Különleges eset: a te példád szerinti objektum
            // {balloons: {name: '...', price: 5000}, flowers: {name: '...', price: 8000}, ...}
            const firstKey = Object.keys(extraServicesData)[0];
            const firstValue = extraServicesData[firstKey];
            
            console.log('🔍 Első kulcs:', firstKey);
            console.log('🔍 Első érték:', firstValue);
            
            // Ha az érték object és van name/price property-je
            if (firstValue && typeof firstValue === 'object' && 
                (firstValue.name || firstValue.price !== undefined)) {
                console.log('🎯 Megtalálva: nested object struktúra');
                
                return Object.entries(extraServicesData).map(([key, value]) => {
                    return {
                        id: key,
                        name: value.name || key,
                        price: value.price || 0,
                        rawValue: value // DEBUG
                    };
                });
            }
            
            // Ha az érték szám (direct mapping)
            if (typeof firstValue === 'number') {
                console.log('🎯 Megtalálva: key->number mapping');
                
                return Object.entries(extraServicesData).map(([key, value]) => {
                    return {
                        id: key,
                        name: key,
                        price: value
                    };
                });
            }
            
            // Általános object -> array konvertálás
            console.log('🔄 Általános object -> array konvertálás');
            return Object.entries(extraServicesData).map(([key, value]) => {
                // Ha az érték object
                if (value && typeof value === 'object') {
                    return {
                        id: key,
                        name: value.name || key,
                        price: value.price || 0,
                        ...value
                    };
                }
                // Ha az érték szám
                else if (typeof value === 'number') {
                    return {
                        id: key,
                        name: key,
                        price: value
                    };
                }
                // Egyéb esetek
                else {
                    return {
                        id: key,
                        name: key,
                        price: 0
                    };
                }
            });
        }
        
        console.log('❌ Nem feldolgozható formátum:', typeof extraServicesData);
        return [];
        
    } catch (error) {
        console.error('❌ Parse hiba:', error);
        console.error('❌ Error stack:', error.stack);
        return [];
    }
}

// **JAVÍTOTT: ASZTALFOGLALÁS STÁTUSZ FRISSÍTÉSE AZ ADATBÁZISBAN**
async function updateReservationStatusInDatabase(reservationId, status, orderId) {
    try {
        console.log(`🔄 Asztalfoglalás státusz frissítése adatbázisban: ${reservationId} -> ${status}, OrderId: ${orderId}`);
        
        // **FONTOS: A CartManager-ben lévő foglalás adatainak lekérése**
        let dbReservationId = null;
        let extraServices = null;
        let reservationData = null;
        
        if (window.cartManager) {
            // Keresd meg a foglalást a CartManager-ben
            const reservation = window.cartManager.userReservations?.find(
                r => r.reservationId === reservationId
            );
            
            if (reservation) {
                reservationData = reservation;
                console.log('✅ Foglalás megtalálva CartManager-ben:', reservation);
                
                // **FONTOS: Extra services kimentése**
                extraServices = reservation.extraServices;
                console.log('📦 ExtraServices a CartManager-ből:', extraServices);
                console.log('📦 ExtraServices type:', typeof extraServices);
                
                // Először próbáljuk a dbReservationId-t használni
                if (reservation.dbReservationId) {
                    dbReservationId = reservation.dbReservationId;
                    console.log('✅ dbReservationId megtalálva:', dbReservationId);
                } else {
                    // Ha nincs dbReservationId, használjuk a helyi reservationId-t
                    dbReservationId = reservationId;
                    console.log('⚠️ Nincs dbReservationId, helyi ID használata:', reservationId);
                }
            } else {
                console.error('❌ Foglalás nem található a CartManager-ben');
                return { success: false, error: 'Foglalás nem található' };
            }
        }
        
        if (!dbReservationId) {
            console.error('❌ Nem található foglalás ID');
            return { success: false, error: 'Nem található foglalás ID' };
        }
        
        console.log('📡 Küldött foglalás ID:', dbReservationId);
        console.log('📡 Küldött ExtraServices:', extraServices);
        
        // **FONTOS: Küldjük az extra services-t is az API-nak**
        const updateData = {
            ReservationId: dbReservationId, // **FONTOS: dbReservationId küldése!**
            Status: status,
            OrderId: orderId
        };
        
        // **HA VAN EXTRA SERVICES, ADJUK HOZZÁ**
        if (extraServices) {
            updateData.ExtraServices = extraServices;
            console.log('📦 ExtraServices hozzáadva az API kéréshez');
        }
        
        // **HA VAN RESERVATION DATA, KÜLDJÜK A TÖBBI ADATOT IS**
        if (reservationData) {
            updateData.ReservationData = {
                TableName: reservationData.tableName,
                TableNumber: reservationData.tableNumber,
                TableLocation: reservationData.tableLocation,
                Date: reservationData.date,
                Time: reservationData.time,
                Guests: reservationData.guests,
                Message: reservationData.message,
                ExtraServices: reservationData.extraServices
            };
        }
        
        console.log('📤 API küldendő adatok:', updateData);
        
        const response = await fetch('/Reservation/UpdateReservationStatus', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(updateData)
        });
        
        console.log('📡 API válasz státusz:', response.status);
        
        if (response.ok) {
            const apiResult = await response.json();
            console.log('📦 API válasz adatok:', apiResult);
            
            if (apiResult.success) {
                console.log('✅ Asztalfoglalás státusza frissítve az adatbázisban');
                console.log('📊 Frissített foglalás adatok:', apiResult);
                return { success: true, data: apiResult.reservation };
            } else {
                console.error('❌ API válasz hibát jelzett:', apiResult);
                return { success: false, error: apiResult};
            }
        } else {
            let errorText = await response.text();
            console.error('❌ HTTP hiba:', response.status, errorText);
            return { success: false, error: `HTTP ${response.status}: ${errorText.substring(0, 100)}` };
        }
        
    } catch (error) {
        console.error('❌ Adatbázis frissítés hiba:', error);
        return { success: false, error: error.message };
    }
}

$('#checkout-btn').on('click', async function() {
    const $btn = $(this);
    
    // 1. KOSÁR ADATOK ÖSSZEGYŰJTÉSE
    if (window.cartManager && window.cartManager.isInitialized) {
        orderCartData = cartManager.getCartData();
    } else {
        const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
        orderCartData = {
            items: cartItems,
            totalItems: cartItems.reduce((total, item) => total + item.quantity, 0),
            totalPrice: cartItems.reduce((total, item) => total + (item.price * item.quantity), 0)
        };
    }
    
    // JAVÍTÁS: Ételek és foglalás ellenőrzése
    const foodItems = orderCartData.items ? orderCartData.items.filter(item => 
        item.type !== 'reservation' && 
        !item.reservationData
    ) : [];
    
    // Aktív foglalás lekérése - BÁRMILYEN ASZTALFOGLALÁS
    const activeReservation = window.cartManager ? cartManager.getActiveReservation() : null;
    
    // Ha nincs étel ÉS nincs aktív foglalás, akkor hiba
    if (foodItems.length === 0 && !activeReservation) {
        showEmptyCartModal();
        return;
    }
    
    // HA VAN AKTÍV FOGLALÁS (akár extra szolgáltatások nélkül is), FOLYTATHATJUK
    if (activeReservation) {
        console.log('📅 Asztalfoglalás találva, rendelés folytatása:', activeReservation.reservationId);
    }
    
    // HA VANNAK ÉTELEK, AKKOR IS FOLYTATHATJUK
    if (foodItems.length > 0) {
        console.log('🍽️ Ételek találva a kosárban:', foodItems.length);
    }
    
    // MENTJÜK A TÉTELEKET az email küldéshez (lehet üres is)
    orderItems = JSON.parse(JSON.stringify(foodItems));
    
    // 2. FELHASZNÁLÓI ADATOK LEKÉRÉSE
    orderUserData = await getUserData();
    
    console.log('👤 Felhasználó adatok a rendeléshez:', {
        isAuthenticated: orderUserData.isAuthenticated,
        userName: orderUserData.userName,
        email: orderUserData.email
    });
    
    // 3. AKTÍV FOGLALÁS RÉSZLETES ADATAI
    currentReservationDetails = null;
    if (window.cartManager) {
        currentReservationDetails = cartManager.getReservationDetails();
        console.log('📅 Asztalfoglalás részletei rendeléshez:', currentReservationDetails);
    }
    
    // 4. ÖSSZEGZÉS KISZÁMÍTÁSA
    orderFoodTotal = foodItems.reduce((total, item) => total + (item.price * (item.quantity || 1)), 0);
    orderServiceFee = Math.round(orderFoodTotal * 0.1);
    
    // Extra szolgáltatások számolása (ha vannak)
    extraServicesTotal = 0;
    extraServicesList = [];
    
    if (currentReservationDetails && currentReservationDetails.extraServices) {
        const extraResult = calculateExtraServicesNoDiscount(currentReservationDetails);
        extraServicesTotal = extraResult.total;
        extraServicesList = extraResult.services;
    }
    
    orderTotalAmount = orderFoodTotal + orderServiceFee + extraServicesTotal;
    
    console.log('💰 Végösszeg számítás:', {
        foodTotal: orderFoodTotal,
        serviceFee: orderServiceFee,
        extraServicesTotal: extraServicesTotal,
        totalAmount: orderTotalAmount,
        hasReservation: !!currentReservationDetails
    });
    
    // 5. HA NINCS BEJELENTKEZVE, KÉRJÜK BE A NEVET ÉS EMAIL CÍMET
    if (!orderUserData.isAuthenticated) {
        console.log('👤 Guest user rendelés - adatok bekérése');
        showGuestInfoModal();
        return;
    }
    
    // 6. ELLENŐRIZD, HOGY VAN-E EMAIL CÍM (bejelentkezett felhasználónál)
    if (orderUserData.isAuthenticated && (!orderUserData.email || orderUserData.email.trim() === '')) {
        console.error('❌ NINCS EMAIL CÍM a felhasználónak!');
        showEmailMissingModal();
        return;
    }
    
    // 7. ELLENŐRZÉS: HÁZHOZSZÁLLÍTÁS?
    proceedWithOrder();

// Email cím validáció
function isValidEmail(email) {
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email);
}

        showAddressModal();
    } else {
        // Ha nincs házhozszállítás (vagy csak asztalfoglalás), csak fizetési modal
        showPaymentModal();
    }
}

// Cím formázása stringgé az adatbázisba - ÚJ FÜGGVÉNY
function formatDeliveryAddressForDB(address) {
    if (!address) return null;
    
    // Ha már string és JSON, próbáljuk parse-olni
    if (typeof address === 'string') {
        try {
            const parsed = JSON.parse(address);
            if (parsed && typeof parsed === 'object') {
                // Ha már objektum, visszaadjuk
                return {
                    Street: parsed.street || parsed.Street || '',
                    City: parsed.city || parsed.City || '',
                    Zip: parsed.zip || parsed.Zip || '',
                    Floor: parsed.floor || parsed.Floor || '',
                    Notes: parsed.notes || parsed.Notes || ''
                };
            }
        } catch (e) {
            // Nem JSON, ignoráljuk
        }
        return null;
    }
    
    // Objektum formázása a backend által várt formátumra
    if (typeof address === 'object') {
        return {
            Street: address.street || address.Street || '',
            City: address.city || address.City || '',
            Zip: address.zip || address.Zip || '',
            Floor: address.floor || address.Floor || '',
            Notes: address.notes || address.Notes || ''
        };
    }
    
    return null;
}
// Segédfüggvény: cím objektum formázása olvasható stringgé 
function formatAddressObjectToString(address) {
    let formattedAddress = '';
    
    // Utca, házszám
    if (address.street || address.Street) {
        formattedAddress += (address.street || address.Street);
    }
    
    // Város
    if (address.city || address.City) {
        if (formattedAddress) formattedAddress += ', ';
        formattedAddress += (address.city || address.City);
    }
    
    // Irányítószám
    if (address.zip || address.Zip) {
        if (formattedAddress) formattedAddress += ', ';
        formattedAddress += (address.zip || address.Zip);
    }
    
    // Emelet, ajtószám
    if (address.floor || address.Floor) {
        if (formattedAddress) formattedAddress += ', ';
        formattedAddress += (address.floor || address.Floor);
    }
    
    // Megjegyzés a futárnak
    if (address.notes || address.Notes) {
        formattedAddress += ` (${address.notes || address.Notes})`;
    }
    
    return formattedAddress || null;
}

                        <h4 class="mb-3" style="color: var(--accent);">Köszönjük a rendelését!</h4>
                        <p class="text-muted mb-4">Rendelését sikeresen rögzítettük. Az alábbiakban láthatja a részleteket.</p>
                        
                        <!-- Order info -->
                        <div class="mb-4">
                            <div class="success-info-item">
                                <i class="bi bi-receipt"></i>
                                <span class="success-info-label">Rendelési azonosító:</span>
                                <span class="success-info-value font-weight-bold">${orderId}</span>
                            </div>
                            <div class="success-info-item">
                                <i class="bi bi-calendar"></i>
                                <span class="success-info-label">Rendelés dátuma:</span>
                                <span class="success-info-value">${orderDate}</span>
                            </div>
                            <div class="success-info-item">
                                <i class="bi bi-cash-stack"></i>
                                <span class="success-info-label">Ételek:</span>
                                <span class="success-info-value">${displayFoodTotal} Ft</span>
                            </div>
                            <div class="success-info-item">
                                <i class="bi bi-percent"></i>
                                <span class="success-info-label">Szolgáltatási díj:</span>
                                <span class="success-info-value">${displayServiceFee} Ft</span>
                            </div>
                            
                            ${extraServicesTotal > 0 ? `  <!-- ITT A PARAMÉTER! -->
                            <div class="success-info-item">
                                <i class="bi bi-stars"></i>
                                <span class="success-info-label">Extra szolgáltatások:</span>
                                <span class="success-info-value text-info">${displayExtraServicesTotal} Ft</span>
                            </div>
                            ` : ''}
                            
                            <div class="success-info-item">
                                <i class="bi bi-credit-card"></i>
                                <span class="success-info-label">Fizetési mód:</span>
                                <span class="success-info-value">${paymentMethod === 'card' ? 'Bankkártya' : 'Készpénz'}</span>
                            </div>
                        </div>
                        
                        <!-- Delivery address -->
                        ${deliveryAddress ? `
                        <div class="mb-4 text-left">
                            <div class="success-info-item">
                                <i class="bi bi-truck"></i>
                                <span class="success-info-label">Szállítási cím:</span>
                            </div>
                            <div class="delivery-address-compact">
                                ${deliveryAddress.street}, ${deliveryAddress.city}, ${deliveryAddress.zip}
                                ${deliveryAddress.floor ? `<br><small class="text-muted">${deliveryAddress.floor}</small>` : ''}
                                ${deliveryAddress.notes ? `<br><small class="text-muted"><i>"${deliveryAddress.notes}"</i></small>` : ''}
                            </div>
                        </div>
                        ` : ''}
                        
                        <!-- Extra services details (if any) -->
                        ${displayExtraServicesList.length > 0 ? `
                        <div class="mb-4 text-left">
                            <div class="success-info-item">
                                <i class="bi bi-stars"></i>
                                <span class="success-info-label">Extra szolgáltatások:</span>
                            </div>
                            <div class="extra-services-compact-details">
                                ${displayExtraServicesList.map(service => `
                                    <div class="d-flex justify-content-between small mb-1">
                                        <span>${service.name}:</span>
                                        <span class="font-weight-bold">${service.price ? service.price.toLocaleString() : '0'} Ft</span>
                                    </div>
                                `).join('')}
                                <div class="d-flex justify-content-between border-top mt-2 pt-2">
                                    <strong>Összesen:</strong>
                                    <strong class="text-info">${displayExtraServicesTotal} Ft</strong>
                                </div>
                            </div>
                        </div>
                        ` : ''}
                        
                        <!-- Notes -->
                        ${notes ? `
                        <div class="mb-4 text-left">
                            <div class="success-info-item">
                                <i class="bi bi-chat-text"></i>
                                <span class="success-info-label">Megjegyzés:</span>
                            </div>
                            <div class="notes-compact">
                                "${notes}"
                            </div>
                        </div>
                        ` : ''}
                        
                        <!-- Reservation -->
                        ${reservationDetails ? `
                        <div class="mb-4 text-left">
                            <div class="success-info-item">
                                <i class="bi bi-calendar-check"></i>
                                <span class="success-info-label">Asztalfoglalás:</span>
                            </div>
                            <div class="reservation-compact">
                                <div class="mb-2">
                                    <strong>${reservationDetails.tableName}</strong> (${reservationDetails.tableNumber || 'N/A'})
                                </div>
                                <div class="mb-1"><small>${formattedDate}, ${formattedTime}</small></div>
                                <div class="mb-1"><small>${reservationDetails.guests} fő</small></div>
                                <div class="mt-2">
                                    <span class="status-badge success">
                                        <i class="bi bi-check-circle mr-1"></i>
                                        Rendeléshez csatolva
                                    </span>
                                </div>
                            </div>
                        </div>
                        ` : ''}
                        
                        <!-- Notifications -->
                        <div class="mt-4">
                            ${emailSent ? `
                            <div class="notification-item">
                                <i class="bi bi-envelope-check"></i>
                                <div>
                                    <strong>Email elküldve</strong>
                                    <p class="mb-0 small">A rendelés részleteiről emailt küldtünk a megadott címre.</p>
                                </div>
                            </div>
                            ` : `
                            <div class="notification-item">
                                <i class="bi bi-envelope-exclamation text-warning"></i>
                                <div>
                                    <strong>Email nem lett elküldve</strong>
                                    <p class="mb-0 small">A rendelés sikeresen rögzítve, de technikai hiba miatt az email nem lett elküldve.</p>
                                </div>
                            </div>
                            `}
                            
                            <div class="notification-item">
                                <i class="bi bi-clock-history"></i>
                                <div>
                                    <strong>Feldolgozás</strong>
                                    <p class="mb-0 small">Rendelését hamarosan elkezdjük feldolgozni. Emailben értesítjük a státusz változásokról.</p>
                                </div>
                            </div>
                            
                            ${displayExtraServicesList.length > 0 ? `
                            <div class="notification-item">
                                <i class="bi bi-stars text-info"></i>
                                <div>
                                    <strong>Extra szolgáltatások</strong>
                                    <p class="mb-0 small">Kiválasztott extra szolgáltatásait előkészítjük.</p>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                        
                        <!-- Total amount summary -->
                        <div class="alert alert-success mt-4">
                            <div class="d-flex justify-content-between">
                                <span class="font-weight-bold">Összesen fizetendő:</span>
                                <span class="font-weight-bold h5 mb-0">${displayTotalAmount} Ft</span>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">
                            Bezárás
                        </button>
                        <button type="button" class="btn btn-primary" onclick="window.location.href='index.html'">
                            <i class="bi bi-house mr-2"></i> Főoldal
                        </button>
                        <button type="button" class="btn btn-success" onclick="window.location.href='profile.html'">
                            <i class="bi bi-list-check mr-2"></i> Rendeléseim
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    $('body').append(modalHTML);
    $('#orderSuccessModal').modal('show');
    
    $('#orderSuccessModal').on('hidden.bs.modal', function () {
        $(this).remove();
    });
}
// Üres kosár modal - JAVÍTOTT ÜZENET (asztalfoglalás nélküli esetre)
function showEmptyCartModal() {
    const modalHTML = `
        <div class="modal fade empty-cart-modal" id="emptyCartModal" tabindex="-1" role="dialog" aria-labelledby="emptyCartModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="emptyCartModalLabel">
                            <i class="bi bi-cart-x text-warning mr-2"></i>
                            Nincs rendelhető elem
                        </h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span>&times;</span>
                        </button>
                    </div>
                    <div class="modal-body text-center">
                        <div class="mb-4">
                            <i class="bi bi-emoji-frown" style="font-size: 4rem; color: var(--accent);"></i>
                        </div>
                        <h4 class="mb-3">Nincs mit rendelned!</h4>
                        <p>A kosarad üres és nincs aktív asztalfoglalásod sem.</p>
                        <p class="text-muted small">Rendeléshez adj ételeket a kosárhoz, vagy foglalj asztalt!</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">
                            Bezárás
                        </button>
                        <button type="button" class="btn btn-primary" onclick="window.location.href='menu.html'">
                            <i class="bi bi-arrow-left mr-2"></i> Menü
                        </button>
                        <button type="button" class="btn btn-success" onclick="window.location.href='reserve.html'">
                            <i class="bi bi-calendar-plus"></i> Asztalfoglalás
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    if (!$('#emptyCartModal').length) {
        $('body').append(modalHTML);
    }
    
    $('#emptyCartModal').modal('show');
    
    $('#emptyCartModal').on('hidden.bs.modal', function () {
        $(this).remove();
    });
}

      // Kosár változás figyelése
      window.addEventListener('cartUpdated', function(event) {
        console.log('🔄 Kosár frissült, újratöltés...', event.detail);
        
        if (window.cartManager && window.cartManager.isInitialized) {
          const cartData = cartManager.getCartData();
          updateCartDisplay(cartData);
          updateSummary(cartData);
        } else {
          loadCartDataFallback();
        }
      });

      // Asztalfoglalás változás figyelése
      window.addEventListener('reservationUpdated', function() {
        console.log('🔄 Asztalfoglalás frissült, újratöltés...');
        loadReservation();
      });

      // CartManager esemény figyelése
      window.addEventListener('cartManagerReady', function() {
        console.log('✅ CartManager kész, kosár adatok betöltése');
        loadCartData();
        loadReservation();
      });

      // Kezdeti betöltés - Várakozás a CartManager-re
      waitForCartManager(function() {
        loadCartData();
        loadReservation();
      });

      // Animációk indítása
      setTimeout(function() {
        $('#page-container').addClass('animated');
        $('#cart-container').addClass('animated');
        $('#cart-card').addClass('animated');
        $('#cart-header').addClass('animated');
        $('#cart-icon').addClass('animated');
        $('#cart-title').addClass('animated');
        $('#cart-subtitle').addClass('animated');
        $('#checkout-btn').addClass('animated');
      }, 300);

      setTimeout(function() {
        $('#cart-items-section').addClass('animated');
        $('#reservation-display-section').addClass('animated');
        $('#summary-section').addClass('animated');
      }, 600);

      // Debug információk
      setTimeout(function() {
        if (window.cartManager && window.cartManager.getDebugInfo) {
          console.log('🔍 Kosár adatok:', cartManager.getDebugInfo());
        }
      }, 2000);
    });
